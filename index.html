<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Proceso de producción - Alimentos Polar Chivacoa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {
                colors: { scada: { bg: '#121820', card: '#1e2638', border: '#2a354d', cyan: '#00f0ff', green: '#00ff88', amber: '#ffb700' } },
                fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
            } }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #121820; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: #121820; }
        ::-webkit-scrollbar-thumb { background: #2a354d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f0ff; }
        .glass-panel { background: rgba(30, 38, 56, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(42, 53, 77, 0.8); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-scada-cyan selection:text-black">

    <header class="glass-panel sticky top-0 z-50 px-4 py-3 shadow-lg border-b border-scada-border">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3 w-full md:w-auto">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-scada-cyan to-blue-600 flex items-center justify-center text-black font-bold text-xl shadow-lg shadow-scada-cyan/20">
                    <i class="fa-solid fa-industry"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wider text-white uppercase flex items-center gap-2">
                        Alimentos Polar <span class="text-xs px-2 py-0.5 rounded bg-scada-cyan/10 text-scada-cyan border border-scada-cyan/30">Chivacoa</span>
                    </h1>
                    <p class="text-xs text-slate-400 font-mono">Guía didáctica del proceso</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 w-full md:w-auto justify-end">
                <button id="soundToggleBtn" onclick="toggleAudio()" class="px-3 py-1.5 rounded-md bg-scada-bg border border-scada-border hover:border-scada-cyan text-xs text-slate-300 hover:text-scada-cyan transition flex items-center gap-2">
                    <i id="soundIcon" class="fa-solid fa-volume-high text-scada-cyan"></i>
                    <span id="soundText" class="hidden sm:inline">Sonido</span>
                </button>
                <div class="relative flex-1 md:w-48">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-500"></i>
                    <input type="text" id="searchInput" onkeyup="filterEquipment()" placeholder="Buscar equipo..." class="w-full bg-scada-bg border border-scada-border rounded-md pl-8 pr-3 py-1 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-scada-cyan transition">
                </div>
            </div>
        </div>
    </header>

    <nav class="bg-scada-bg border-b border-scada-border sticky top-[65px] z-40 shadow-inner">
        <div class="max-w-7xl mx-auto px-4 overflow-x-auto">
            <div class="flex space-x-2 py-2 min-w-max" id="stageTabsContainer"></div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

        <div class="flex items-center justify-between glass-panel p-5 rounded-xl">
            <div class="flex items-center space-x-4">
                <div id="stageIconContainer" class="w-14 h-14 rounded-xl bg-scada-cyan/10 border border-scada-cyan/30 flex items-center justify-center text-scada-cyan text-2xl shadow-inner"></div>
                <div>
                    <span id="stageBadge" class="text-[10px] font-mono px-2 py-0.5 rounded bg-scada-cyan/20 text-scada-cyan border border-scada-cyan/40">ETAPA 01</span>
                    <h2 id="stageTitle" class="text-2xl font-bold text-white tracking-wide mt-1">Recepción</h2>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-7">
                <div class="glass-panel p-6 rounded-xl border border-scada-border h-full">
                    <div class="border-b border-scada-border pb-3 mb-4">
                        <h3 class="text-base font-bold uppercase tracking-wider text-slate-200 flex items-center gap-2">
                            <i class="fa-solid fa-file-lines text-scada-cyan"></i> Descripción del Proceso
                        </h3>
                    </div>
                    <div id="stageDescription" class="text-sm text-slate-300 leading-relaxed space-y-4 font-normal"></div>
                </div>
            </div>
            <div class="lg:col-span-5">
                <div class="glass-panel p-6 rounded-xl border border-scada-border h-full">
                    <div class="flex items-center justify-between border-b border-scada-border pb-3 mb-4">
                        <h3 class="text-base font-bold uppercase tracking-wider text-slate-200 flex items-center gap-2">
                            <i class="fa-solid fa-gears text-scada-cyan"></i> Equipos
                        </h3>
                        <span id="equipmentCountBadge" class="text-xs font-mono bg-scada-cyan/20 text-scada-cyan px-2.5 py-1 rounded border border-scada-cyan/40"></span>
                    </div>
                    <div id="equipmentList" class="space-y-2.5 max-h-[420px] overflow-y-auto pr-1"></div>
                </div>
            </div>
        </div>

        <div id="docsSection" class="glass-panel p-6 rounded-xl border border-scada-border hidden">
            <div class="flex items-center justify-between border-b border-scada-border pb-3 mb-4">
                <h3 class="text-base font-bold uppercase tracking-wider text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-file-pdf text-scada-cyan"></i> Documentos
                </h3>
                <span class="text-xs text-slate-400">Códigos de motores</span>
            </div>
            <div id="docsList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        </div>

    </main>

    <footer class="glass-panel border-t border-scada-border py-4 mt-8">
        <div class="max-w-7xl mx-auto px-4 text-xs text-slate-400 text-center md:text-left">
            Planta Alimentos Polar Chivacoa - Material didáctico para pasantes - 2026
        </div>
    </footer>

    <script>
        const stagesData = [
            {
                id: 1, name: "Recepción", icon: "fa-truck-field",
                        description: `
            <p>Recepción y clasificación inicial de materia prima (maíz nacional e importado) proveniente del transporte terrestre.</p>
            <p>Las gandolas y camiones se pesan en <strong>balanzas de pesaje estático</strong> y se toman <strong>muestras de control de calidad</strong>. Luego descargan en las <strong>tolvas de Recepción 1 y 2</strong>, protegidas con rejillas metálicas.</p>
            <p>Desde las tolvas, <strong>transportadores de cadenas (BKT / Redler)</strong> llevan el grano hacia los <strong>elevadores de cangilones</strong>. En el cabezal del elevador, un <strong>sistema de aspiración con filtro de mangas</strong> extrae el polvo en suspensión.</p>
            <p>En la prelimpieza, el grano pasa por un <strong>tamiz rotativo</strong> que remueve las impurezas gruesas, por las <strong>separadoras de grano</strong> para una clasificación fina (su residuo se destina a subproducto) y por un <strong>imán rotativo</strong> que retiene partículas metálicas. Finalmente se almacena en el <strong>silo de reposo</strong>, donde el grano se homogeniza temporalmente antes del secado.</p>`,
        equipment: ["Balanzas de Pesaje Estático", "Tolvas de Descarga (Recepción 1 y 2)", "Transportadores de Cadenas BKT", "Elevadores de Cangilones", "Sistema de Aspiración y Filtro de Mangas", "Tamiz Rotativo", "Separadoras de Grano", "Imán Rotativo", "Silo de Reposo"],
                docs: [["Equipos de Recepción y Preparación", "equipos-recepcion.pdf"]]
            },
            {
                id: 2, name: "Secado", icon: "fa-fire-flame-curved",
                description: `
                    <p>Proceso térmico continuo para la reducción controlada de humedad en el maíz recién recibido.</p>
                    <p>Utiliza <strong>secadoras industriales de columna y flujo continuo</strong> altamente eficientes, garantizando la conservación idónea del grano y previniendo la proliferación de hongos e impurezas orgánicas.</p>`,
                equipment: ["Secadoras Industriales de Columna", "Secadoras de Flujo Continuo", "Sensores de Control de Humedad"],
                docs: []
            },
            {
                id: 3, name: "Silos", icon: "fa-warehouse",
                description: `
                    <p>Almacenamiento masivo y seguro del grano seco en los <strong>silos principales de materia prima</strong>.</p>
                    <p>Cuenta con un sistema avanzado de <strong>aireación forzada</strong> y <strong>monitoreo termométrico continuo</strong> a través de sensores distribuidos para mantener la calidad óptima de la materia prima durante periodos prolongados.</p>`,
                equipment: ["Silos Principales de Materia Prima", "Sistema de Aireación Forzada", "Red de Monitoreo de Temperatura"],
                docs: [["Equipos de Recepción y Preparación (incluye ventiladores de silos)", "equipos-recepcion.pdf"]]
            },
            {
                id: 4, name: "Limpieza / Desgerminación", icon: "fa-filter-circle-xmark",
                description: `
                    <p><strong>Limpieza:</strong> Es la fase inicial del acondicionamiento del grano de maíz ya seco, donde se emplean equipos especializados como <strong>tararas</strong> (para la separación por aspiración de polvo, impurezas ligeras y partículas livianas) y <strong>sifters</strong> (separadores tamizadores). Su objetivo principal es garantizar que el grano entre a los procesos mecánicos posteriores totalmente libre de cuerpos extraños, garantizando los estándares de inocuidad y calidad alimentaria.</p>
                    <p><strong>Degerminación:</strong> Es el corazón mecánico del proceso donde se utiliza tecnología de punta (como los equipos <strong>Satake</strong> y las líneas integradas de degerminación) para fracturar el grano de maíz de manera controlada. El propósito fundamental es separar el endospermo (de donde se obtendrá la harina) del germen y la cascarilla, extrayendo este último sin pulverizarlo excesivamente para asegurar la pureza del producto y optimizar el rendimiento industrial.</p>`,
                equipment: ["Línea Desgerminación 04", "Línea Limpieza 02", "Tararas de Aspiración", "Sifters de Clasificación", "Cocinas Horizontales", "Unidades Desgermina Satake"],
                docs: [["Equipos de Limpieza", "equipos-limpieza.pdf"], ["Equipos de Desgerminación", "equipos-desgerminacion.pdf"]]
            },
            {
                id: 5, name: "Laminación", icon: "fa-scroll",
                description: `
                    <p>Transformación física del grano condicionado en hojuelas mediante tratamiento térmico y prensado.</p>
                    <p>El material ingresa a <strong>bines metálicos superiores</strong>, dosificado mecánicamente por <strong>Rotoflow</strong> hacia las <strong>cocinas verticales</strong>. Pasa por los <strong>laminadores</strong>, <strong>secadoras/enfriadoras</strong>, <strong>molinos de premolienda</strong> y se deposita en los <strong>silos de hojuela molida</strong>.</p>`,
                equipment: ["Bines Metálicos Superiores", "Dosificadores Rotoflow", "Cocinas Verticales", "Laminadores Industriales", "Secadoras / Enfriadoras", "Molinos de Premolienda", "Silos de Hojuela Molida"],
                docs: [["Equipos de Laminación", "equipos-laminacion.pdf"]]
            },
            {
                id: 6, name: "Molienda", icon: "fa-wheat-awn",
                description: `
                    <p>Reducción granulométrica precisa del producto para la obtención de harina de maíz de alta finura.</p>
                    <p>Utiliza <strong>molinos Bühler de 2 y 4 rodillos</strong> de alta tecnología, complementados por <strong>unidades Satake</strong>, <strong>Sifters de clasificación de pasajes</strong>, <strong>Tararas de aspiración</strong> y <strong>Filtros de manga</strong> para retención de fino.</p>`,
                equipment: ["Molinos Bühler (2 y 4 Rodillos)", "Unidades Molienda Satake", "Sifters de Clasificación", "Tararas de Aspiración", "Filtros Manga Industriales"],
                docs: [["Equipos de Molienda", "equipos-molienda.pdf"]]
            },
            {
                id: 7, name: "Humidificación y Vitaminas", icon: "fa-flask-vial",
                description: `
                    <p>Ajuste de humedad final y fortificación nutricional de la harina según especificaciones de calidad nacional e internacional.</p>
                    <p>Pasa por <strong>humidificadores industriales</strong>, sistemas micro-dosificadores de premezcla de <strong>vitaminas y hierro</strong>, integrados mediante <strong>sinfines de mezcla y transferencia rápida</strong>.</p>`,
                equipment: ["Humidificadores Industriales", "Dosificación Micronutrientes (Hierro/Vit)", "Sinfines de Mezcla y Transferencia"],
                docs: [["Equipos de Humidificación (hoja dentro del listado de Molienda)", "equipos-molienda.pdf"]]
            },
            {
                id: 8, name: "Empaque y Paletizado", icon: "fa-boxes-packing",
                description: `
                    <p>Extracción desde silos de producto terminado por sinfines hacia sifters, entoleter (pulverizador grumos), bajantes con imanes y bines metálicos con imán de entrada.</p>
                    <div class="mt-2 space-y-2 border-l-2 border-scada-cyan pl-3 text-xs">
                        <p><strong>• Línea SIG:</strong> Formado horizontal con mandriles (90% mecánica / 10% eléctrica). Dirige la bolsa hacia una <strong>enfardadora</strong> para formar bultos y de allí a las <strong>paletizadoras</strong>.</p>
                        <p><strong>• Línea Rovema:</strong> Formado vertical automatizado (electrónica avanzada). Pasa por máquina <strong>Polypack</strong> y es conducido hacia un <strong>brazo robótico</strong> para el paletizado.</p>
                    </div>`,
                equipment: ["Silos de Producto Terminado", "Sinfines de Distribución", "Sifters de Clasificación Final", "Entoleter (Pulverizador Grumos)", "Bajantes e Imanes de Retención", "Bines Metálicos c/ Imán Entrada", "Máquinas Embaladoras SIG", "Enfardadora de Bultos (Línea SIG)", "Máquinas Empacadoras Rovema", "Empacadora Polypack (Línea Rovema)", "Brazo Robótico Paletizador (Rovema)", "Estaciones Paletizadoras Estándar"],
                docs: [["Equipos de Empaque", "equipos-empaque.pdf"]]
            }
        ];

        let activeStageId = 1;
        let audioEnabled = true;
        let audioCtx = null;

        window.addEventListener('DOMContentLoaded', () => { loadStage(1); });

        function playBeep(freq = 800, type = 'sine', duration = 0.08) {
            if (!audioEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) { console.log("Audio bloqueado", e); }
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            document.getElementById('soundIcon').className = audioEnabled ? 'fa-solid fa-volume-high text-scada-cyan' : 'fa-solid fa-volume-xmark text-slate-500';
            document.getElementById('soundText').innerText = audioEnabled ? 'Sonido' : 'Silencio';
            if (audioEnabled) playBeep(1200, 'sine', 0.1);
        }

        function renderTabs() {
            const container = document.getElementById('stageTabsContainer');
            container.innerHTML = '';
            stagesData.forEach(stage => {
                const isActive = stage.id === activeStageId;
                const tab = document.createElement('button');
                tab.onclick = () => { playBeep(600, 'triangle', 0.05); loadStage(stage.id); };
                tab.className = `flex items-center space-x-2 px-4 py-2 rounded-lg font-medium text-xs transition duration-200 uppercase tracking-wide whitespace-nowrap ${
                    isActive
                    ? 'bg-scada-cyan/20 text-scada-cyan border border-scada-cyan/50 shadow-lg shadow-scada-cyan/10 font-bold'
                    : 'bg-scada-card text-slate-400 hover:text-white border border-scada-border hover:border-slate-500'
                }`;
                tab.innerHTML = `
                    <span class="font-mono text-[10px] opacity-75">0${stage.id}.</span>
                    <i class="fa-solid ${stage.icon} text-sm"></i>
                    <span>${stage.name}</span>`;
                container.appendChild(tab);
            });
        }

        function loadStage(stageId) {
            activeStageId = stageId;
            const stage = stagesData.find(s => s.id === stageId);
            if (!stage) return;
            renderTabs();
            document.getElementById('stageBadge').innerText = `ETAPA 0${stage.id}`;
            document.getElementById('stageTitle').innerText = stage.name;
            document.getElementById('stageIconContainer').innerHTML = `<i class="fa-solid ${stage.icon}"></i>`;
            document.getElementById('stageDescription').innerHTML = stage.description;
            document.getElementById('equipmentCountBadge').innerText = `${stage.equipment.length} equipos`;
            renderEquipmentList(stage.equipment);
            renderDocs(stage.docs);
            document.getElementById('searchInput').value = '';
        }

        function renderEquipmentList(equipment) {
            const container = document.getElementById('equipmentList');
            container.innerHTML = '';
            equipment.forEach(name => {
                const item = document.createElement('div');
                item.className = "flex items-center space-x-3 bg-scada-bg/90 border border-scada-border p-3 rounded-lg";
                item.innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-scada-cyan"></span>
                    <span class="text-xs font-semibold text-slate-200">${name}</span>`;
                container.appendChild(item);
            });
        }

        function filterEquipment() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const stage = stagesData.find(s => s.id === activeStageId);
            if (!stage) return;
            renderEquipmentList(stage.equipment.filter(n => n.toLowerCase().includes(query)));
        }

        function renderDocs(docs) {
            const section = document.getElementById('docsSection');
            const list = document.getElementById('docsList');
            list.innerHTML = '';
            if (!docs || docs.length === 0) { section.classList.add('hidden'); return; }
            section.classList.remove('hidden');
            docs.forEach(([name, file]) => {
                const a = document.createElement('a');
                a.href = file;
                a.className = "flex items-center justify-between bg-scada-bg/90 border border-scada-border hover:border-scada-cyan/60 p-3 rounded-lg transition group";
                a.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-file-pdf text-scada-cyan"></i>
                        <span class="text-xs font-semibold text-slate-200 group-hover:text-scada-cyan transition">${name}</span>
                    </div>
                    <i class="fa-solid fa-download text-xs text-slate-500 group-hover:text-scada-cyan transition"></i>`;
                list.appendChild(a);
            });
        }
    </script>
</body>
</html>
